name: Scraper Health Check

on:
  schedule:
    - cron: "0 11 * * 1" # Runs every Monday at 11:00 UTC
  workflow_dispatch: # Allows manual execution

jobs:
  test_scraper:
    name: Run Scraper Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev python3-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Test configuration (no browser required)
        run: |
          echo "🔧 Testing configuration validity..."
          uv run pytest tests/test_website_layout.py::test_test_configuration -v
          uv run pytest tests/test_website_layout.py::test_sport_coverage -v
          uv run pytest tests/test_website_layout.py::test_market_variety -v
          uv run pytest tests/test_website_layout.py::test_url_validity -v
          echo "✅ All configuration tests passed!"

      - name: Install Playwright Chromium Browser
        run: uv run playwright install chromium

      - name: Run bounded live canaries
        env:
          CANARY_MATCH_URL: https://www.oddsportal.com/football/england/premier-league/leicester-brentford-xQ77QTN0
        run: |
          set -euo pipefail
          mkdir -p health-artifacts

          timeout 10m uv run oddsharvester upcoming \
            --sport football \
            --match-link "$CANARY_MATCH_URL" \
            --market 1x2 \
            --preview-only \
            --headless \
            --concurrency 1 \
            --request-delay 0 \
            --engine playwright \
            --output health-artifacts/upcoming-matches \
            --report-output health-artifacts/upcoming-report.json

          timeout 10m uv run oddsharvester historic \
            --sport football \
            --match-link "$CANARY_MATCH_URL" \
            --season 2024-2025 \
            --market 1x2 \
            --preview-only \
            --headless \
            --concurrency 1 \
            --request-delay 0 \
            --engine auto \
            --output health-artifacts/historic-matches \
            --report-output health-artifacts/historic-report.json

          uv run python scripts/verify_health_report.py \
            health-artifacts/upcoming-report.json \
            health-artifacts/historic-report.json

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scraper-health-${{ github.run_id }}
          path: health-artifacts/
          if-no-files-found: warn
